<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Buscar Jugadores</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar 
    (ionInput)="searchPlayers($event)" 
    placeholder="Buscar por nombre, apellido o equipo..."
    animated>
  </ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let player of searchResults" [routerLink]="['/player-edit', player.id]">
      <ion-label>
        <h2>{{ player.nombre }} {{ player.apellido }}</h2>
        <p>{{ player.equipo }}</p>
        <p>
          <ion-badge [color]="getEstadoColor(player.estado)">
            {{ player.estado }}
          </ion-badge>
        </p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="searchResults.length === 0 && hasSearched" class="ion-text-center ion-padding">
    <ion-text color="medium">
      <p>No se encontraron jugadores</p>
    </ion-text>
  </div>
</ion-content>
